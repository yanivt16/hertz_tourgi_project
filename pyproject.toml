[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuse-verifiers"
version = "0.1.0"
description = "Reimplementation of FUSE: Ensembling Verifiers with Zero Labeled Data (arXiv:2604.18547)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.23", "fsspec", "pyarrow>=15", "pandas>=2"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
